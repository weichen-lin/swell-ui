packages:
  - docs
allowBuilds:
  esbuild: true
  lefthook: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  vite-plus: 1.3.0
minimumReleaseAgeExclude:
  - '@fumadocs/base-ui@16.19.4'
  - fumadocs-core@16.19.4
overrides:
  glob@>=9.0.0 <=14.0.1: ^14.0.2
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vite-plus
    - vitest
  allowedVersions:
    vite: '*'
    vite-plus: '*'
    vitest: '*'
