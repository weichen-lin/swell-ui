packages:
  - docs
allowBuilds:
  esbuild: true
  lefthook: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  vite-plus: 1.3.0
minimumReleaseAgeExclude:
  - '@fumadocs/base-ui@16.19.4'
  - fumadocs-core@16.19.4
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
