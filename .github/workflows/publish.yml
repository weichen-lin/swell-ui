name: Publish

# Release flow: `npm version patch|minor|major` locally (bumps package.json, commits, tags vX.Y.Z),
# then `git push --follow-tags`. This workflow publishes that tag to npm.

on:
  push:
    tags: ['v*']

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  LEFTHOOK: 0

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Tag must match package.json version
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $v"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # pnpm pack rewrites catalog: specifiers; npm publish handles OIDC trusted publishing.
      - run: pnpm pack --pack-destination out
      - run: npm publish out/*.tgz --access public
        env:
          # Leave the NPM_TOKEN secret unset when trusted publishing is configured.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
