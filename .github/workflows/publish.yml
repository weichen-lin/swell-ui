name: Publish

# Release flow: `npm version patch|minor|major` locally (bumps package.json, commits, tags X.Y.Z
# with no "v" prefix, see .npmrc), then `git push --follow-tags`. This workflow publishes that tag.

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  LEFTHOOK: 0

jobs:
  # Fail fast, before the full CI run: tag vs package.json, and not already on npm.
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Tag must match package.json, version must be new on npm
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          if npm view "$name@$version" version --registry https://registry.npmjs.org 2>/dev/null | grep -q .; then
            echo "::error::$name@$version is already published on npm"
            exit 1
          fi
          echo "Will publish $name@$version"

  check:
    needs: verify
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # pnpm pack rewrites catalog: specifiers; npm publish handles OIDC trusted publishing.
      # The "./" matters: without it npm reads out/x.tgz as a GitHub owner/repo shorthand.
      - run: pnpm pack --pack-destination out
      - name: Tarball version must match tag
        run: |
          tgz=$(ls out/*.tgz)
          version=$(tar -xOzf "$tgz" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::$tgz has version $version, tag is $GITHUB_REF_NAME"
            exit 1
          fi
          echo "Publishing $tgz"
      - run: npm publish ./out/*.tgz --access public
        env:
          # Leave the NPM_TOKEN secret unset when trusted publishing is configured.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
